# OmniDocBench evaluator config; score.sh fills in {method}
end2end_eval:   # the registry key at the pinned commit (its own sample configs say End2end_eval)
  metrics:
    text_block:
      metric: [Edit_dist]
    display_formula:
      metric: [Edit_dist]   # CDM skipped: needs TeX Live
    table:
      metric: [TEDS, Edit_dist]
      teds_workers: 6
    reading_order:
      metric: [Edit_dist]
  dataset:
    dataset_name: end2end_dataset
    ground_truth:
      data_path: /data/hard_gt.json
    prediction:
      data_path: /data/pred/{method}
    match_method: quick_match
    match_workers: 6
    quick_match_truncated_timeout_sec: 300
    match_timeout_sec: 420
    timeout_fallback_max_chunk_span: 10
    timeout_fallback_order_penalty: 0.10
