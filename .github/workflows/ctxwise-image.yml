# Builds the ctxwise CPU image and publishes it to ghcr.io/ctxwise/docling-serve.
# Release: push a tag like v1.35.0-ctxwise.1 (see ctxwise/README.md).
name: ctxwise image

on:
  push:
    tags: ["v*-ctxwise.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        # The image is large; the runner's preinstalled SDKs are not needed.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ctxwise/docling-serve
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          # Same as upstream's docling-serve-cpu image (.github/image-matrix.json).
          build-args: UV_SYNC_EXTRA_ARGS=--no-group pypi --group cpu --no-extra flash-attn
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
